      <aside
        id="mobileLayersPanel"
        class="mobile-layers-panel"
        aria-label="Layers"
        aria-hidden="true"
        inert
      >
        <div class="mobile-layers-toolbar" role="toolbar" aria-label="Layer actions">
          <button
            id="mobileAddLayer"
            class="mobile-layers-toolbar-action"
            type="button"
            aria-label="Add layer"
            title="Add layer"
            disabled
          >
            <span class="mobile-icon-stack" aria-hidden="true">
              <i data-lucide="plus" class="mobile-icon-layer mobile-icon-outline"></i>
              <i data-lucide="plus" class="mobile-icon-layer mobile-icon-face"></i>
            </span>
          </button>
          <button
            id="mobileCopyLayer"
            class="mobile-layers-toolbar-action"
            type="button"
            aria-label="Duplicate selected layer"
            title="Duplicate selected layer"
            disabled
          >
            <span class="mobile-icon-stack" aria-hidden="true">
              <i data-lucide="copy" class="mobile-icon-layer mobile-icon-outline"></i>
              <i data-lucide="copy" class="mobile-icon-layer mobile-icon-face"></i>
            </span>
          </button>
          <button
            id="mobileAddMask"
            class="mobile-layers-toolbar-action"
            type="button"
            aria-label="Add mask"
            title="Add mask"
            disabled
          >
            <span class="mobile-icon-stack" aria-hidden="true">
              <i data-lucide="square-dashed" class="mobile-icon-layer mobile-icon-outline"></i>
              <i data-lucide="square-dashed" class="mobile-icon-layer mobile-icon-face"></i>
            </span>
          </button>
          <button
            id="mobileLayerMultiSelect"
            class="mobile-layers-toolbar-action"
            type="button"
            aria-label="Select multiple layers"
            aria-controls="mobileLayerList"
            aria-pressed="false"
            title="Select multiple layers"
            disabled
          >
            <span class="mobile-icon-stack" aria-hidden="true">
              <i data-lucide="check" class="mobile-icon-layer mobile-icon-outline"></i>
              <i data-lucide="check" class="mobile-icon-layer mobile-icon-face"></i>
            </span>
          </button>
        </div>
        <div id="mobileLayerList" class="mobile-layer-list" role="list"></div>
        <div
          id="mobileLayerMultiActions"
          class="mobile-layer-multi-actions"
          hidden
        >
          <button
            id="mobileLayerMergeSelection"
            type="button"
            aria-describedby="mobileLayerMergeStatus"
          >
            Unisci livelli
          </button>
        </div>
        <p
          id="mobileLayerMergeStatus"
          class="mobile-layer-merge-status"
          role="status"
          hidden
        ></p>
        <div
          id="mobileLayerContextMenu"
          class="mobile-layer-context-menu"
          role="menu"
          aria-label="Layer actions"
          tabindex="-1"
          hidden
          inert
        >
          <button
            id="mobileLayerClipping"
            type="button"
            role="menuitemcheckbox"
            aria-checked="false"
          >
            Clipping Mask
          </button>
          <button id="mobileLayerOptions" type="button" role="menuitem">
            Options
          </button>
          <button
            id="mobileLayerMerge"
            type="button"
            role="menuitem"
            aria-describedby="mobileLayerMergeReason"
            hidden
          >
            Unisci livelli
          </button>
          <p id="mobileLayerMergeReason" role="status" hidden></p>
          <button
            id="mobileLayerDelete"
            class="is-destructive"
            type="button"
            role="menuitem"
          >
            Delete Layer
          </button>
        </div>
        <p
          id="mobileLayerReorderStatus"
          class="visually-hidden"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></p>
      </aside>

      <p
        id="layerSwitchResult"
        class="visually-hidden"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        Layer panel ready.
      </p>
