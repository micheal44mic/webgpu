    <div
      id="startupLoadingOverlay"
      class="startup-loading-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="startupLoadingTitle"
      aria-describedby="startupLoadingDetail"
      hidden
    >
      <section class="startup-loading-card">
        <p class="startup-loading-kicker">M1M4 · WEBGPU</p>
        <div class="startup-loading-heading">
          <div>
            <h2 id="startupLoadingTitle">Preparazione dell’editor</h2>
            <p id="startupLoadingDetail">Caricamento del motore grafico…</p>
          </div>
          <strong id="startupLoadingPercent" aria-hidden="true">0%</strong>
        </div>
        <progress
          id="startupLoadingProgress"
          class="startup-loading-progress"
          max="100"
          value="0"
          aria-label="Avanzamento caricamento editor"
        ></progress>
        <p id="startupLoadingStep" class="startup-loading-step" aria-live="polite">
          Avvio in corso…
        </p>
        <p id="startupLoadingError" class="startup-loading-error" role="alert" hidden></p>
        <button id="startupLoadingCopyDiagnostics" type="button" hidden>
          Copia diagnosi
        </button>
      </section>
    </div>
